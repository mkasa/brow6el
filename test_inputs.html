<!DOCTYPE html>
<html>
<head>
    <title>Input Test - Brow6el</title>
    <style>
        body { font-family: Arial; padding: 40px; }
        .test-section { margin: 30px 0; padding: 20px; border: 2px solid #ccc; }
        label { display: block; margin: 10px 0; font-size: 18px; }
        input[type="checkbox"], input[type="radio"] { 
            width: 30px; 
            height: 30px; 
            margin-right: 10px;
            cursor: pointer;
        }
        select { 
            padding: 10px; 
            font-size: 16px; 
            width: 200px;
            cursor: pointer;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Mouse Emulation Input Test</h1>
    
    <div class="test-section">
        <h2>Checkboxes</h2>
        <label>
            <input type="checkbox" id="cb1"> Checkbox 1
        </label>
        <label>
            <input type="checkbox" id="cb2"> Checkbox 2
        </label>
        <label>
            <input type="checkbox" id="cb3" checked> Checkbox 3 (pre-checked)
        </label>
    </div>
    
    <div class="test-section">
        <h2>Radio Buttons</h2>
        <label>
            <input type="radio" name="radio-group" value="1"> Radio Option 1
        </label>
        <label>
            <input type="radio" name="radio-group" value="2"> Radio Option 2
        </label>
        <label>
            <input type="radio" name="radio-group" value="3"> Radio Option 3
        </label>
    </div>
    
    <div class="test-section">
        <h2>Select/Combobox</h2>
        <label>
            Choose an option:
            <select id="combo">
                <option value="">-- Select --</option>
                <option value="opt1">Option 1</option>
                <option value="opt2">Option 2</option>
                <option value="opt3">Option 3</option>
                <option value="opt4">Option 4</option>
            </select>
        </label>
    </div>
    
    <div class="test-section">
        <h2>Text Input (should only focus)</h2>
        <label>
            Text field:
            <input type="text" id="text1" placeholder="Type here...">
        </label>
    </div>
    
    <script>
        // Log changes for verification
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function() {
                console.log('Checkbox ' + this.id + ' changed to: ' + this.checked);
            });
        });
        
        document.querySelectorAll('input[type="radio"]').forEach(rb => {
            rb.addEventListener('change', function() {
                console.log('Radio button changed to: ' + this.value);
            });
        });
        
        document.getElementById('combo').addEventListener('change', function() {
            console.log('Select changed to: ' + this.value);
        });
    </script>
</body>
</html>
